name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Run Lean physics tests
        run: lake exe tests
      - name: Generate mission catalog
        run: lake exe lean-testing

  frontend:
    runs-on: ubuntu-latest
    needs: lean
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Generate trajectory.json
        run: lake exe lean-testing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
