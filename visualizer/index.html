<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epstein Drive — Transit Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="canvas-container">
  <canvas id="simCanvas"></canvas>

  <div id="hud">

    <!-- Top bar -->
    <div id="top-bar">
      <span id="sim-title">EPSTEIN DRIVE ▸ TRANSIT SIM</span>
      <span class="hud-separator">|</span>
      <span id="time-display">T+0d</span>
      <span id="eta-display"></span>
      <span class="hud-separator">|</span>
      <button id="play-btn" class="hud-btn">⏸ PAUSE</button>
      <div id="speed-control">
        <span class="dim">SPD</span>
        <input type="range" id="speed-slider" min="0" max="100" value="40" step="1">
        <span id="speed-label">10×</span>
      </div>
    </div>

    <!-- Mission picker (left) -->
    <div id="picker-panel">
      <h3>MISSION</h3>
      <div class="picker-group">
        <div class="picker-label">ROUTE</div>
        <div id="route-list"></div>
      </div>
      <div class="picker-group">
        <div class="picker-label">DRIVE</div>
        <div id="drive-list"></div>
      </div>
      <div id="phase-box">
        <span class="picker-label">DRIVE PHASE</span>
        <div id="phase-indicator">—</div>
      </div>
    </div>

    <!-- Numbers panel (right) -->
    <div id="numbers-panel">
      <h3 id="np-route">— → —</h3>
      <div id="np-drive" class="np-drive">—</div>

      <div class="np-row"><span class="np-key">TRANSIT TIME</span><span class="np-val" id="np-transit">—</span></div>
      <div class="np-row"><span class="np-key">PEAK VELOCITY</span><span class="np-val" id="np-peakv">—</span></div>
      <div class="np-row"><span class="np-key">DRIVE ACCEL</span><span class="np-val" id="np-accel">—</span></div>
      <div class="np-row"><span class="np-key">Δv BUDGET</span><span class="np-val" id="np-dv">—</span></div>

      <div id="np-speedup-box">
        <div id="np-speedup">—</div>
        <div class="np-speedup-sub">vs. chemical (Hohmann)</div>
      </div>
      <div id="np-baseline-note">Chemical baseline — today's tech</div>
    </div>

    <!-- Bottom bar: scrub -->
    <div id="bottom-bar">
      <div id="scrub-container">
        <span class="dim">TIME</span>
        <input type="range" id="scrub-slider" min="0" max="240" value="0" step="1">
      </div>
    </div>

  </div><!-- #hud -->

  <div id="loading">LOADING TRANSIT CATALOG<div id="loading-bar"></div></div>

</div><!-- #canvas-container -->

<script src="sim.js"></script>
</body>
</html>
