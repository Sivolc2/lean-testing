<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Physics — Epstein Drive Transit Sim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #01030a; min-height: 100%; }
  body {
    font-family: "Courier New", Courier, monospace;
    color: #9fd8c8; padding-bottom: 80px;
  }
  #doc-top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(2,18,16,0.97), rgba(2,18,16,0.88));
    border-bottom: 1px solid #1c3a30; backdrop-filter: blur(2px);
  }
  #doc-title { color: #6fe0c0; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 14px #2a6a5666; }
  .hud-btn {
    background: #0c241c; color: #7fd8c0; border: 1px solid #235244;
    padding: 4px 10px; font-family: inherit; font-size: 12px; cursor: pointer;
    letter-spacing: 1px; border-radius: 2px; white-space: nowrap;
    text-decoration: none; display: inline-block; transition: all .12s;
  }
  .hud-btn:hover { background: #143228; border-color: #3a7a64; }
  .hud-btn.active { background: #12352a; color: #6fe0c0; border-color: #4fbf9c; box-shadow: 0 0 8px #2a6a5666; }
  #flow {
    width: 100%; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: #7fb8a8; padding-top: 6px;
  }
  #flow .step { border: 1px dashed #2c4a40; padding: 3px 8px; border-radius: 2px; }
  #flow .step b { color: #ffd966; }
  #flow .arrow { color: #557066; }
  #doc-content {
    max-width: 860px; margin: 24px auto 0; padding: 0 18px;
    font-size: 14px; line-height: 1.65;
  }
  #doc-content h1 { color: #6fe0c0; letter-spacing: 1px; font-size: 22px; margin: 18px 0 10px; text-shadow: 0 0 14px #2a6a5644; }
  #doc-content h2 { color: #ffd966; font-size: 17px; margin: 26px 0 8px; border-bottom: 1px solid #1c3a30; padding-bottom: 4px; }
  #doc-content h3 { color: #ffb060; font-size: 14px; margin: 18px 0 6px; }
  #doc-content p, #doc-content li { color: #9fd8c8; margin: 8px 0; }
  #doc-content ul, #doc-content ol { padding-left: 22px; }
  #doc-content strong { color: #d8f5ea; }
  #doc-content em { color: #b8e8d8; }
  #doc-content a { color: #66c0ff; text-decoration: none; border-bottom: 1px dotted #2a5a7a; }
  #doc-content a:hover { color: #9fdcff; border-bottom-style: solid; }
  #doc-content code { background: #0c241c; color: #ffd966; padding: 1px 5px; border-radius: 2px; font-size: 13px; }
  #doc-content pre { background: #050f0c; border: 1px solid #1c3a30; padding: 12px; overflow-x: auto; margin: 10px 0; border-radius: 2px; }
  #doc-content pre code { background: none; padding: 0; color: #9fd8c8; }
  #doc-content blockquote { border-left: 3px solid #4fbf9c; background: #07140f; padding: 8px 14px; margin: 10px 0; color: #c8f0e0; }
  #doc-content table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
  #doc-content th { color: #ffd966; text-align: left; border-bottom: 1px solid #3a7a64; padding: 5px 10px; }
  #doc-content td { border-bottom: 1px solid #122a22; padding: 5px 10px; }
  #doc-content tr:hover td { background: #07140f; }
  #doc-content hr { border: none; border-top: 1px solid #1c3a30; margin: 22px 0; }
  #doc-content img { max-width: 100%; }
</style>
</head>
<body>
  <div id="doc-top">
    <span id="doc-title">EPSTEIN DRIVE ▸ THE PHYSICS</span>
    <a class="hud-btn" href="index.html">◀ BACK TO SIM</a>
    <span style="flex:1"></span>
    <button class="hud-btn doc-tab" data-doc="PHYSICS" id="tab-physics">CHEAT SHEET</button>
    <button class="hud-btn doc-tab" data-doc="ORBITAL_MECHANICS" id="tab-orbital">ORBITAL MECHANICS</button>
    <button class="hud-btn doc-tab" data-doc="EPSTEIN_DRIVE" id="tab-drive">EPSTEIN DRIVE</button>
    <div id="flow">
      <span class="step"><b>1</b> RUN THE SIM — flip-and-burn vs chemical, live</span>
      <span class="arrow">▸</span>
      <span class="step"><b>2</b> THE NUMBERS — equations &amp; context (these pages)</span>
      <span class="arrow">▸</span>
      <span class="step"><b>3</b> MORE MISSIONS — press <b>C</b> in the sim for all 25 variants</span>
    </div>
  </div>

  <div id="doc-content"><p>Loading…</p></div>

  <script src="vendor/marked.min.js"></script>
  <script>
    const REPO = 'https://github.com/Sivolc2/lean-testing/blob/main/';
    const DOCS = ['PHYSICS', 'ORBITAL_MECHANICS', 'EPSTEIN_DRIVE'];
    const content = document.getElementById('doc-content');

    function currentDoc() {
      const h = location.hash.replace('#', '').split('.')[0].toUpperCase();
      return DOCS.includes(h) ? h : 'PHYSICS';
    }

    // Map a markdown link target to something that works on the deployed site:
    // sibling .md files become tab switches, repo source files go to GitHub.
    function rewriteHref(href) {
      const m = href.match(/^([A-Z_]+)\.md(#.*)?$/);
      if (m) return '#' + m[1];
      if (href.startsWith('../../')) return REPO + href.slice(6);
      if (href.startsWith('../')) return REPO + 'visualizer/' + href.slice(3);
      return href;
    }

    async function load(doc) {
      document.querySelectorAll('.doc-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.doc === doc));
      try {
        const res = await fetch('docs/' + doc + '.md');
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        if (window.marked) {
          content.innerHTML = marked.parse(md);
          content.querySelectorAll('a[href]').forEach(a => {
            a.href = rewriteHref(a.getAttribute('href'));
            if (a.href.startsWith(REPO)) { a.target = '_blank'; a.rel = 'noopener'; }
          });
        } else {
          const pre = document.createElement('pre');
          pre.textContent = md;
          content.replaceChildren(pre);
        }
        window.scrollTo(0, 0);
      } catch (e) {
        content.innerHTML = '<p>Could not load docs/' + doc + '.md (' + e.message + ')</p>';
      }
    }

    document.querySelectorAll('.doc-tab').forEach(b =>
      b.addEventListener('click', () => { location.hash = b.dataset.doc; }));
    window.addEventListener('hashchange', () => load(currentDoc()));
    load(currentDoc());
  </script>
</body>
</html>
